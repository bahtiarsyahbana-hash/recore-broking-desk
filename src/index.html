<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordes Reinsurance Broking Desk</title>
<meta name="description" content="Interactive prototype of a reinsurance broker core system — facultative and treaty placement, quota share, surplus and excess-of-loss calculators, bordereaux, claims and accounting, plus an optional cedant portal.">
<link rel="icon" type="image/svg+xml" href="assets/brand/recordes-mark-navy.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<!--
  Application shell only. Everything below #view-root and #modal-root is rendered
  by JavaScript: the sidebar from core/navigation.js, the active view from its own
  module under js/views/, and overlays from js/ui/.
-->
<!-- Sign-in renders here; the app shell stays hidden until a session exists. -->
<div id="login-root"></div>

<div class="app" id="app-root" hidden>
  <aside class="sidebar" id="app-sidebar">
    <div class="brand">
      <button type="button" class="mark brand-toggle" id="brand-toggle" aria-controls="app-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -56 112 112" role="img" aria-label="Recordes"><defs><mask id="bm-side-0"><rect x="-56" y="-56" width="112" height="112" fill="#fff"/><path d="M45.65,26.26 A42,42 0 1 1 -3.97,-30.82 A38,38 0 0 0 45.65,26.26 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/></mask><mask id="bm-side-1"><rect x="-56" y="-56" width="112" height="112" fill="#fff"/><path d="M-10.87,51.53 A42,42 0 1 1 28.09,-13.30 A38,38 0 0 0 -10.87,51.53 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/></mask><mask id="bm-side-2"><rect x="-56" y="-56" width="112" height="112" fill="#fff"/><path d="M-52.37,5.59 A42,42 0 1 1 21.32,22.60 A38,38 0 0 0 -52.37,5.59 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/></mask><mask id="bm-side-3"><rect x="-56" y="-56" width="112" height="112" fill="#fff"/><path d="M-21.50,-48.08 A42,42 0 1 1 -14.91,27.27 A38,38 0 0 0 -21.50,-48.08 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/></mask><mask id="bm-side-4"><rect x="-56" y="-56" width="112" height="112" fill="#fff"/><path d="M39.08,-35.30 A42,42 0 1 1 -30.54,-5.75 A38,38 0 0 0 39.08,-35.30 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/></mask></defs><g fill="currentColor"><path d="M39.08,-35.30 A42,42 0 1 1 -30.54,-5.75 A38,38 0 0 0 39.08,-35.30 Z" mask="url(#bm-side-0)"/><path d="M45.65,26.26 A42,42 0 1 1 -3.97,-30.82 A38,38 0 0 0 45.65,26.26 Z" mask="url(#bm-side-1)"/><path d="M-10.87,51.53 A42,42 0 1 1 28.09,-13.30 A38,38 0 0 0 -10.87,51.53 Z" mask="url(#bm-side-2)"/><path d="M-52.37,5.59 A42,42 0 1 1 21.32,22.60 A38,38 0 0 0 -52.37,5.59 Z" mask="url(#bm-side-3)"/><path d="M-21.50,-48.08 A42,42 0 1 1 -14.91,27.27 A38,38 0 0 0 -21.50,-48.08 Z" mask="url(#bm-side-4)"/></g></svg></button>
      <div class="brand-text">
        <div class="name">Recordes</div>
        <div class="sub">Reinsurance Broking Desk</div>
      </div>
    </div>
    <nav class="nav" id="nav-broker"></nav>
    <nav class="nav" id="nav-cedant" hidden></nav>
    <div class="sidebar-foot">
      <div class="sidebar-org" id="sidebar-org"></div>
      <div id="sidebar-foot"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <!-- Which workspace you are in follows from the account, not a toggle. -->
      <span class="workspace" id="workspace-label"></span>
      <span class="chip" id="cedant-flag-chip" hidden>optional module · limited access</span>
      <div class="spacer"></div>
      <span class="chip" id="chip-uwy"></span>
      <span class="chip" id="chip-ccy"></span>
      <div class="identity">
        <div class="identity-text">
          <span class="identity-name" id="identity-name"></span>
          <span class="identity-title" id="identity-title"></span>
        </div>
        <div class="avatar" id="avatar"></div>
        <button class="btn ghost sign-out" id="sign-out" title="Sign out">Sign out</button>
      </div>
    </header>

    <!-- The active view module renders here. -->
    <main id="view-root"></main>
  </div>
</div>

<!-- Overlays (submission wizard, program lifecycle drawer) mount here. -->
<div id="modal-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
