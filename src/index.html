<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordes Reinsurance Broking Desk</title>
<meta name="description" content="Interactive prototype of a reinsurance broker core system — facultative and treaty placement, quota share, surplus and excess-of-loss calculators, bordereaux, claims and accounting, plus an optional cedant portal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23001233%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Georgia,serif%27 font-size=%2718%27 font-weight=%27600%27 fill=%27%23ffffff%27 text-anchor=%27middle%27%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<!--
  Application shell only. Everything below #view-root and #modal-root is rendered
  by JavaScript: the sidebar from core/navigation.js, the active view from its own
  module under js/views/, and overlays from js/ui/.
-->
<!-- Sign-in renders here; the app shell stays hidden until a session exists. -->
<div id="login-root"></div>

<div class="app" id="app-root" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">R</div>
      <div>
        <div class="name">Recordes</div>
        <div class="sub">Reinsurance Broking Desk</div>
      </div>
    </div>
    <nav class="nav" id="nav-broker"></nav>
    <nav class="nav" id="nav-cedant" hidden></nav>
    <div class="sidebar-foot">
      <div class="sidebar-org" id="sidebar-org"></div>
      <div id="sidebar-foot"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <!-- Which workspace you are in follows from the account, not a toggle. -->
      <span class="workspace" id="workspace-label"></span>
      <span class="chip" id="cedant-flag-chip" hidden>optional module · limited access</span>
      <div class="spacer"></div>
      <span class="chip" id="chip-uwy"></span>
      <span class="chip" id="chip-ccy"></span>
      <div class="identity">
        <div class="identity-text">
          <span class="identity-name" id="identity-name"></span>
          <span class="identity-title" id="identity-title"></span>
        </div>
        <div class="avatar" id="avatar"></div>
        <button class="btn ghost sign-out" id="sign-out" title="Sign out">Sign out</button>
      </div>
    </header>

    <!-- The active view module renders here. -->
    <main id="view-root"></main>
  </div>
</div>

<!-- Overlays (submission wizard, program lifecycle drawer) mount here. -->
<div id="modal-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
